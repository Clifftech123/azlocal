name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore version tooling
        run: dotnet restore src/AzLocal.Client
      - name: Validate release version and source
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          $publish = $env:EVENT_NAME -eq 'release'
          $version = dotnet msbuild src/AzLocal.Client -target:MinVer -getProperty:Version -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Could not calculate the package version from Git.' }
          if ($publish) {
            if (-not $env:TAG_NAME.StartsWith('v')) { throw 'Release tags must start with v.' }
            if ($version -cne $env:TAG_NAME.Substring(1)) {
              throw "Git calculated $version, which does not match the release tag."
            }
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw 'Use a version such as 0.1.0-alpha.1 or 0.1.0.'
          }
          $null = [System.Management.Automation.SemanticVersion]::Parse($version)
          if ($publish) {
            $prerelease = $version.Contains('-')
            if ($prerelease -ne ($env:IS_PRERELEASE -eq 'true')) {
              throw 'The GitHub prerelease flag must match the version suffix.'
            }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Publish releases only from commits merged into main.' }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build-and-test:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --no-restore --logger trx
      - name: Pack
        shell: pwsh
        run: ./eng/Pack.ps1 -Version '${{ env.PACKAGE_VERSION }}' -NoBuild
      - name: Test installed packages
        shell: pwsh
        run: ./eng/Test-Packages.ps1 -PackageDirectory 'artifacts/packages/${{ env.PACKAGE_VERSION }}' -Version '${{ env.PACKAGE_VERSION }}'
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ matrix.os }}
          path: artifacts/packages/${{ env.PACKAGE_VERSION }}/*.nupkg
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tests-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  docker-test:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Test container installation and persistence
        shell: pwsh
        run: ./eng/Test-Docker.ps1 -Version '${{ needs.validate.outputs.version }}'
      - name: Export tested image
        run: docker save azlocal:local -o azlocal-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: tested-docker-image
          path: azlocal-image.tar
          if-no-files-found: error

  docker-publish:
    needs: [validate, build-and-test, docker-test]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-docker-image
      - name: Check Docker Hub configuration
        shell: pwsh
        env:
          HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          HUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_NAMESPACE }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HUB_USERNAME) -or [string]::IsNullOrWhiteSpace($env:HUB_TOKEN) -or [string]::IsNullOrWhiteSpace($env:HUB_NAMESPACE)) {
            throw 'Configure DOCKERHUB_USERNAME, DOCKERHUB_NAMESPACE, and DOCKERHUB_TOKEN before publishing.'
          }
          if ($env:HUB_NAMESPACE -notmatch '^[a-z0-9][a-z0-9_-]+$') { throw 'Invalid Docker Hub namespace.' }
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested image
        shell: pwsh
        env:
          HUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_NAMESPACE }}
          IMAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker load -i azlocal-image.tar
          if ($LASTEXITCODE -ne 0) { throw 'Could not load the tested image.' }
          $tag = "$env:HUB_NAMESPACE/azlocal:$env:IMAGE_VERSION"
          docker tag azlocal:local $tag
          if ($LASTEXITCODE -ne 0) { throw 'Image tagging failed.' }
          docker push $tag
          if ($LASTEXITCODE -ne 0) { throw 'Versioned image push failed.' }
          if (-not $env:IMAGE_VERSION.Contains('-')) {
            docker tag azlocal:local "$env:HUB_NAMESPACE/azlocal:latest"
            if ($LASTEXITCODE -ne 0) { throw 'Stable image tagging failed.' }
            docker push "$env:HUB_NAMESPACE/azlocal:latest"
            if ($LASTEXITCODE -ne 0) { throw 'Stable image push failed.' }
          }

  publish:
    needs: [validate, build-and-test, docker-test]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-ubuntu-latest
          path: artifacts/packages
      - name: Check NuGet profile configuration
        shell: pwsh
        env:
          NUGET_USER: ${{ secrets.NUGET_USER || vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'Set the NUGET_USER repository secret or variable to your NuGet profile username.'
          }
      - name: Authenticate to NuGet with Trusted Publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER || vars.NUGET_USER }}
      - name: Publish Core and Client to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NuGet Trusted Publishing did not return a temporary publishing credential.'
          }
          foreach ($id in @('AzLocal.Core', 'AzLocal.Client')) {
            $package = "artifacts/packages/$id.$env:PACKAGE_VERSION.nupkg"
            dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Publishing $id failed." }
          }
      - name: Attach packages to the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          $packages = @(Get-ChildItem artifacts/packages -Filter '*.nupkg' | ForEach-Object { $_.FullName })
          gh release upload $env:TAG_NAME @packages --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading release assets failed.' }
