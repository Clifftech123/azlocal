name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Calculate image version
        id: version
        shell: pwsh
        run: |
          dotnet restore src/AzLocal.Client
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          $version = dotnet msbuild src/AzLocal.Client -target:MinVer -getProperty:Version -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Version calculation failed.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Test Docker SDK operations and persistent storage
        shell: pwsh
        run: ./eng/Test-Docker.ps1 -Version '${{ steps.version.outputs.version }}'

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --no-restore --logger trx

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = dotnet msbuild src/AzLocal.Client -target:MinVer -getProperty:Version -nologo
          if ($LASTEXITCODE -ne 0) { throw "Could not read the package version." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Pack
        shell: pwsh
        run: ./eng/Pack.ps1 -Version '${{ steps.version.outputs.version }}' -NoBuild

      - name: Test installed packages
        shell: pwsh
        run: ./eng/Test-Packages.ps1 -PackageDirectory 'artifacts/packages/${{ steps.version.outputs.version }}' -Version '${{ steps.version.outputs.version }}'

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/**/*.nupkg
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
